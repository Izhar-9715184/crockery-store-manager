<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://api.github.com https://gist.githubusercontent.com; manifest-src 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14343b">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Maal Entry">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="app.css">
  <title>Maal Entry</title>
</head>
<body>
  <header class="top">
    <div>
      <h1>Maal Entry</h1>
      <div class="sub" id="status">Wholesale purchase list</div>
    </div>
    <button class="icon" id="menuBtn" aria-label="Menu">⋮</button>
  </header>
  <div id="banner" class="banner" hidden></div>

  <main id="main">
    <section class="card">
      <div class="row2">
        <label class="f"><span>Supplier / shop</span>
          <input id="supplier" type="text" list="suppliers" placeholder="e.g. Rafiq Traders" autocomplete="off"></label>
        <label class="f"><span>Date</span><input id="date" type="date"></label>
      </div>
      <datalist id="suppliers"></datalist>
    </section>

    <section class="card">
      <h2>Add item</h2>
      <label class="f"><span>Product name</span>
        <input id="name" type="text" list="plist" placeholder="e.g. Dinner Plate" autocomplete="off" autocapitalize="words"></label>
      <datalist id="plist"></datalist>
      <div id="hint" class="hint" hidden></div>
      <button class="btn block" id="stockBtn" type="button" style="margin:-2px 0 10px">🧮 See my stock</button>
      <div class="row2">
        <label class="f"><span>Quantity</span><input id="qty" type="text" inputmode="decimal" placeholder="24"></label>
        <label class="f"><span>Cost price (each)</span><input id="cost" type="text" inputmode="decimal" placeholder="120"></label>
      </div>
      <details id="more"><summary>Sale price (only for new products)</summary>
        <label class="f"><span>Sale price (each)</span><input id="sale" type="text" inputmode="decimal" placeholder="optional"></label>
      </details>
      <div class="add-row"><div id="amt" class="amt"></div><button class="btn primary" id="addBtn">Add to list</button></div>
    </section>

    <section>
      <div class="list-head"><h2>This list</h2><span id="count" class="muted"></span></div>
      <div id="lines"></div>
    </section>
  </main>

  <footer class="bar" id="bar">
    <div><div id="totalAmt" class="total">Rs 0</div><div id="totalSub" class="muted small">No items yet</div></div>
    <button class="btn primary big" id="sendBtn">Send to laptop</button>
  </footer>

  <div id="toast" class="toast" hidden></div>
  <div id="sheets"></div>

  <script src="packing.js"></script>
  <script src="stockcrypto.js"></script>
  <script src="app.js"></script>
</body>
</html>
