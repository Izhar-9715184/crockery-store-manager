name: Build and publish update

# Push a tag like v1.0.4 -> this builds TWO Windows installers and publishes them
# in ONE GitHub Release:
#   1. Crockery-Store-Manager-Setup-<ver>.exe                 Windows 10 / 11 (64-bit)
#   2. Crockery-Store-Manager-Win7-8-64bit-Setup-<ver>.exe    Windows 7 / 8 / 8.1 (64-bit)
# Each installed copy updates itself from its own channel (latest / legacy),
# so a Windows 8 laptop never receives the Windows 10 program or the other way round.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create the release (once, so the builds do not fight)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="$GITHUB_REF_NAME"
          VER="${TAG#v}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$VER" --notes "Version $VER" --verify-tag

  build:
    needs: create-release
    runs-on: windows-latest
    strategy:
      fail-fast: false     # if one installer fails, the other is still published
      matrix:
        include:
          - { kind: modern, arch: x64,  channel: latest,   name: Crockery-Store-Manager-Setup }
          - { kind: legacy, arch: x64,  channel: legacy,   name: Crockery-Store-Manager-Win7-8-64bit-Setup }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install (Windows 10/11 program)
        if: matrix.kind == 'modern'
        run: npm install

      # Windows 7/8 need the older Electron 22 (newer Electron does not run there).
      # It has no built-in SQLite, so the "better-sqlite3" package is added for this build only.
      - name: Install (Windows 7/8 program)
        if: matrix.kind == 'legacy'
        run: |
          npm pkg set devDependencies.electron=22.3.27 dependencies.electron-updater=5.3.0 dependencies.better-sqlite3=8.7.0
          npm install --ignore-scripts
          node node_modules/electron/install.js
          npx electron-builder install-app-deps

      - name: Database / business-logic tests
        run: npm test

      # The build server has no screen, so the test app now and then crashes for reasons unrelated to our code.
      # It gets 3 tries; if all 3 fail, something is really wrong and the build stops.
      - name: Smoke test (starts the real app and checks it loads)
        run: |
          for i in 1 2 3; do
            if npm run smoke; then exit 0; fi
            echo "Smoke test attempt $i failed"; sleep 5
          done
          exit 1

      - name: Set version, update source and installer name
        run: |
          npm pkg set version="${GITHUB_REF_NAME#v}"
          npm pkg set build.publish.owner="${GITHUB_REPOSITORY_OWNER}"
          npm pkg set build.publish.repo="${GITHUB_REPOSITORY#*/}"
          npm pkg set build.nsis.artifactName="${{ matrix.name }}-"'${version}.${ext}'
          if [ "${{ matrix.channel }}" != "latest" ]; then npm pkg set build.publish.channel="${{ matrix.channel }}"; fi

      - name: Build installer
        run: npx electron-builder --win --${{ matrix.arch }} --publish never

      - name: Check the installer files exist
        run: |
          VER="${GITHUB_REF_NAME#v}"
          ls -la dist
          test -f "dist/${{ matrix.channel }}.yml"
          test -f "dist/${{ matrix.name }}-$VER.exe"
          test -f "dist/${{ matrix.name }}-$VER.exe.blockmap"
          cat "dist/${{ matrix.channel }}.yml"

      - name: Add the files to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="$GITHUB_REF_NAME"
          VER="${TAG#v}"
          gh release upload "$TAG" \
            "dist/${{ matrix.name }}-$VER.exe" \
            "dist/${{ matrix.name }}-$VER.exe.blockmap" \
            "dist/${{ matrix.channel }}.yml" --clobber
