name: Build and publish update

# Push a tag like v1.0.4 -> this builds the Windows 10 / 11 (64-bit) installer
#   Crockery-Store-Manager-Setup-<ver>.exe
# and publishes it in a GitHub Release. (The Windows 7/8 build was removed.)
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create the release (once, so the builds do not fight)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="$GITHUB_REF_NAME"
          VER="${TAG#v}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$VER" --notes "Version $VER" --verify-tag

  build:
    needs: create-release
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { kind: modern, arch: x64,  channel: latest,   name: Crockery-Store-Manager-Setup }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install (Windows 10/11 program)
        run: npm install

      - name: Database / business-logic tests
        run: npm test

      # The build server has no screen/graphics card, so the test window can crash for reasons that have
      # nothing to do with our code ("GPU process isn't usable"). The real checks (database, sales, backups,
      # phone server, PIN) run BEFORE the window opens and print "SMOKE BACKEND OK". So:
      #   - test passes completely                      -> fine
      #   - only the graphics crashed after BACKEND OK   -> accepted, with a warning
      #   - anything else                                -> the build stops
      - name: Smoke test (starts the real app and checks it loads)
        run: |
          for i in 1 2 3; do
            if npm run smoke 2>&1 | tee smoke.log; then exit 0; fi
            if grep -q "SMOKE BACKEND OK" smoke.log && grep -q "GPU process isn't usable" smoke.log; then
              echo "::warning::Only the graphics of the build server crashed (not our code). Backend checks passed."
              exit 0
            fi
            echo "Smoke test attempt $i failed"; sleep 5
          done
          exit 1

      - name: Set version, update source and installer name
        run: |
          npm pkg set version="${GITHUB_REF_NAME#v}"
          npm pkg set build.publish.owner="${GITHUB_REPOSITORY_OWNER}"
          npm pkg set build.publish.repo="${GITHUB_REPOSITORY#*/}"
          npm pkg set build.nsis.artifactName="${{ matrix.name }}-"'${version}.${ext}'
          if [ "${{ matrix.channel }}" != "latest" ]; then npm pkg set build.publish.channel="${{ matrix.channel }}"; fi

      - name: Build installer
        run: npx electron-builder --win --${{ matrix.arch }} --publish never

      - name: Check the installer files exist
        run: |
          VER="${GITHUB_REF_NAME#v}"
          ls -la dist
          test -f "dist/${{ matrix.channel }}.yml"
          test -f "dist/${{ matrix.name }}-$VER.exe"
          test -f "dist/${{ matrix.name }}-$VER.exe.blockmap"
          cat "dist/${{ matrix.channel }}.yml"

      - name: Add the files to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="$GITHUB_REF_NAME"
          VER="${TAG#v}"
          gh release upload "$TAG" \
            "dist/${{ matrix.name }}-$VER.exe" \
            "dist/${{ matrix.name }}-$VER.exe.blockmap" \
            "dist/${{ matrix.channel }}.yml" --clobber
